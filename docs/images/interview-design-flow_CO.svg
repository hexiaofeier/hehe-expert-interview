<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" aria-labelledby="title desc">
<title id="title">盒盒访谈设计：同一研究，形成两版可用提纲</title>
<desc id="desc">明确研究要支持的判断，查阅材料并安排知情角色，写主问题和条件追问，编排时间与活动。随后分别形成主持执行版和受访者阅读版，各含Markdown和同内容Word。</desc>
