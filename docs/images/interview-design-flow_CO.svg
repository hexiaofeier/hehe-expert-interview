<text x="64" y="126" font-size="38" fill="#183f54" font-weight="700">同一研究，形成两版可用的访谈提纲</text>
<text x="64" y="168" font-size="22" fill="#566c79">主持人深入追问，受访者提前理解问题并准备。</text>
